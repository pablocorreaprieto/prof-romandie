blocks:
  - h: "Para quién"
    text: |
      Para docentes formados fuera de Suiza que quieren trabajar en una escuela pública de la Suiza francófona. Vienes de España, de Latinoamérica o de otro país, y quieres saber por dónde empezar.

      Esta versión no es una simple traducción de la francesa. Añade lo que importa si vienes de España o de Latinoamérica: el Certificado de Conformidad, las ALCE, los títulos de fuera de la UE y la regla de los dos años para el francés.
  - h: "Cómo lo compruebo"
    text: |
      Cada cifra remite a un documento oficial y cada página indica la fecha de su última comprobación. Cuando cuento lo que he vivido, lo señalo como tal.

      ¿Ves un error o un cambio de norma? Escríbeme a {{contact}} y lo corrijo.
author: |
  Me llamo Pablo Correa Prieto. Estudié Magisterio de Primaria en la Universidad de La Laguna, en Tenerife. La CDIP reconoció mi título en mayo de 2026 y hoy trabajo como maestro sustituto en el cantón de Vaud.
