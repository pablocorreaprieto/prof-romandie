seo_title: "Dar clase en la Suiza francófona | Prof Romandie"
description: "Reconocimiento CDIP, nivel de francés, plazas y sustituciones, sueldo y permiso. Los trámites en orden, con las fuentes oficiales y una experiencia real."
h1: "Dar clase en la Suiza francófona con un título extranjero"
lede: "Los trámites en orden, con los plazos y los costes que publican las autoridades. Escrito por un maestro sustituto del cantón de Vaud que acaba de pasar por ellos."
