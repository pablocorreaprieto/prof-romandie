name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 build.py
        env:
          # Optional repository variable. Empty means readers are sent to the
          # address published on pablocorreaprieto.ch.
          PR_CONTACT_EMAIL: ${{ vars.PR_CONTACT_EMAIL }}
          # Public address of the site. Until profromandie.ch is bought and set
          # as the Pages custom domain, it is the GitHub Pages address below.
          # Afterwards, set the repository variable PR_BASE_URL to
          # https://profromandie.ch (or delete this fallback).
          PR_BASE_URL: ${{ vars.PR_BASE_URL || 'https://pablocorreaprieto.ch/prof-romandie' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
